<head>
<meta name="viewport" content="width=device-width">

<body class="center">

<h2 id="turn"></h2>

<button id="nextBtn">NEXT AGENT</button>

<div id="popup" class="popup">
 <div class="popupBox memberTheme" id="popupBox">
  <h2 id="popupText"></h2>
  <button class="start" id="closePopup">BACK TO LOBBY</button>
 </div>
</div>
